<app-toolbar></app-toolbar>

<div style="max-width: 960px; margin: 0 auto; padding: 1.5rem;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.25rem;">
    <div>
      <h2 style="margin:0;">Credenciales emitidas</h2>
      <p style="color:#666; margin: 2px 0 0;">Club de fútbol Córdoba</p>
    </div>
    <button mat-flat-button color="primary" (click)="goToCreate()">
      <mat-icon>add</mat-icon> Nueva credencial
    </button>
  </div>

  <app-empty-state *ngIf="loaded && credentials.length === 0"></app-empty-state>

  <div *ngIf="credentials.length > 0"
       style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px;">
    <mat-card *ngFor="let c of credentials" (click)="goToDetail(c.id)" style="cursor:pointer;">
      <mat-card-content>
        <div style="display:flex; gap:10px; align-items:center;">
          <div style="width:40px;height:40px;border-radius:50%;background:#e3f2fd;display:flex;align-items:center;justify-content:center;font-weight:500;color:#1565c0;">
            {{ c.firstName[0] }}{{ c.lastName[0] }}
          </div>
          <div>
            <p style="font-weight:500; margin:0;">{{ c.firstName }} {{ c.lastName }}</p>
            <p style="font-size:12px; color:#666; margin:0;">Socio #{{ c.memberNumber }}</p>
          </div>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:12px; color:#666; border-top:1px solid #eee; margin-top:10px; padding-top:8px;">
          <span>{{ c.category }}</span>
          <span [style.color]="c.status === 0 ? '#2e7d32' : '#999'">{{ c.status | credentialStatus }}</span>
        </div>
        <p style="font-size:11px; color:#999; margin:6px 0 0;">
          Vigente hasta {{ c.validUntil | date:'dd/MM/yyyy' }}
        </p>
      </mat-card-content>
    </mat-card>
  </div>
</div>
