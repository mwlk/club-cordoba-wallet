<div class="cc-page">
  <div class="cc-page-header">
    <div class="cc-page-header__text">
      <h1 class="cc-page-title">Credenciales emitidas</h1>
      <p class="cc-page-title-sub">Todas las credenciales de socios del club</p>
    </div>
    <button mat-flat-button color="primary" (click)="goToCreate()">
      <mat-icon>add</mat-icon> Nueva credencial
    </button>
  </div>

  <!-- Skeleton de carga -->
  <div *ngIf="!loaded" class="cc-card-grid list-grid" aria-hidden="true">
    <div class="skeleton-tile" *ngFor="let i of skeletonItems">
      <div class="skeleton-tile__avatar"></div>
      <div class="skeleton-tile__line skeleton-tile__line--lg"></div>
      <div class="skeleton-tile__line skeleton-tile__line--sm"></div>
      <div class="skeleton-tile__line skeleton-tile__line--xs"></div>
    </div>
  </div>

  <div *ngIf="loaded && errored" class="list-empty">
    <app-empty-state title="No se pudo cargar el listado"
                     subtitle="Hubo un error de conexión. Revisá e intentá de nuevo."></app-empty-state>
    <button mat-flat-button color="primary" class="list-empty__cta" (click)="load()">
      <mat-icon>refresh</mat-icon> Reintentar
    </button>
  </div>

  <div *ngIf="loaded && !errored && credentials.length === 0" class="list-empty">
    <app-empty-state></app-empty-state>
    <button mat-flat-button color="primary" class="list-empty__cta" (click)="goToCreate()">
      <mat-icon>add</mat-icon> Crear primera credencial
    </button>
  </div>

  <div *ngIf="!errored && credentials.length > 0" class="cc-card-grid list-grid">
    <mat-card class="list-tile" *ngFor="let c of credentials" (click)="goToDetail(c.id)">
      <mat-card-content class="list-tile__content">
        <div class="list-tile__top">
          <app-member-avatar [name]="c.firstName + ' ' + c.lastName" [photo]="c.photo"></app-member-avatar>
          <span class="list-tile__status" [class.is-active]="c.status === 0 && !isExpired(c)"
                [class.is-inactive]="c.status !== 0 || isExpired(c)">
            {{ isExpired(c) ? 'Vencida' : (c.status | credentialStatus) }}
          </span>
        </div>
        <p class="list-tile__name">{{ c.firstName }} {{ c.lastName }}</p>
        <span class="cc-cat-chip list-tile__chip" [ngClass]="'cc-cat-chip--' + c.category">
          {{ c.category | memberCategory }}
        </span>
        <p class="list-tile__meta">Socio #{{ c.memberNumber }}</p>
        <p class="list-tile__validity">Vigente hasta {{ c.validUntil | date:'dd/MM/yyyy' }}</p>
      </mat-card-content>
    </mat-card>
  </div>
</div>
