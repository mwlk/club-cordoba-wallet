<app-toolbar></app-toolbar>

<div style="max-width: 460px; margin: 2rem auto; padding: 0 1rem;">
  <button mat-button (click)="backToList()">
    <mat-icon>arrow_back</mat-icon> Volver al listado
  </button>

  <div *ngIf="credential" style="margin-top: 1rem;">
    <app-credential-card [credential]="credential" [showSecurityDetails]="true"></app-credential-card>
  </div>

  <app-empty-state *ngIf="notFound" title="Credencial no encontrada" subtitle=""></app-empty-state>
</div>
