<div class="cc-page cc-page--narrow">
  <button mat-button class="detail__back" (click)="backToList()">
    <mat-icon>arrow_back</mat-icon> Volver al listado
  </button>

  <div *ngIf="credential" class="detail__wrap">
    <app-credential-card [credential]="credential" [showSecurityDetails]="true"></app-credential-card>
  </div>

  <app-empty-state *ngIf="notFound && !errored"
                   title="Credencial no encontrada"
                   subtitle="Puede que haya sido removida del club."></app-empty-state>

  <div *ngIf="errored" class="detail__error">
    <app-empty-state title="No se pudo cargar la credencial"
                     subtitle="Hubo un error de conexión. Revisá e intentá de nuevo."></app-empty-state>
    <button mat-flat-button color="primary" class="detail__retry" (click)="load()">
      <mat-icon>refresh</mat-icon> Reintentar
    </button>
  </div>
</div>
