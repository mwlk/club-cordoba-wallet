<label style="font-size:12px; color:#666; display:block; margin-bottom:4px;">DNI</label>
<div style="display:flex; gap:8px; margin-bottom:6px;">
  <input type="text" [(ngModel)]="dni" placeholder="30123456" maxlength="8" style="flex:1;"/>
  <button mat-stroked-button (click)="search()" [disabled]="searching">
    <mat-icon>search</mat-icon>
  </button>
</div>
<p *ngIf="resultMessage" [style.color]="found ? '#2e7d32' : '#999'" style="font-size:12px; margin:0 0 12px;">
  <mat-icon style="font-size:14px; width:14px; height:14px; vertical-align:middle;">
    {{ found ? 'check' : 'info' }}
  </mat-icon>
  {{ resultMessage }}
</p>
