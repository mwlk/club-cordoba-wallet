services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: clubcordobawallet
      POSTGRES_USER: vcwallet
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcwallet -d clubcordobawallet"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      ConnectionStrings__Default: "Host=db;Database=clubcordobawallet;Username=vcwallet;Password=${DB_PASSWORD:-devpass}"
      Issuer__Did: "did:example:futbol"
      Issuer__VerificationMethod: "did:example:futbol#key-1"
      Issuer__HmacKey: ${HMAC_SECRET_KEY:-dev-secret-key-change-me}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy

  ui:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  pgdata:
